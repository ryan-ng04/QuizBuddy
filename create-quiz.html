<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Quiz</title>
    <link rel="stylesheet" href="homepage.css">
    <script src="quizzes.js" defer></script>
</head>

<body>
    <nav class="navbar bg-dark navbar-dark">
        <div class="container-fluid">
            <a href="homepage.html" class="navbar-brand">QuizBuddy</a>
        </div>
    </nav>

    <div class="container mt-5">
        <!-- Step 1: Quiz Details -->
        <div id="step-1" class="step">
            <h2>Step 1: Quiz Details</h2>
            <input type="text" id="quiz-title" placeholder="Quiz Title" class="form-control mb-3">
            <textarea id="quiz-description" rows="3" placeholder="Quiz Description"
                class="form-control mb-3"></textarea>
            <button id="next-step-1" class="btn btn-primary">Next</button>
        </div>

        <!-- Step 2: Number of Questions -->
        <div id="step-2" class="step" style="display: none;">
            <h2>Step 2: Choose Number of Questions</h2>
            <input type="number" id="number-of-questions" min="1" placeholder="Number of Questions"
                class="form-control mb-3">
            <button id="next-step-2" class="btn btn-primary">Next</button>
        </div>

        <!-- Step 3: Add Questions and Answers -->
        <div id="step-3" class="step" style="display: none;">
            <h2>Step 3: Add Questions and Answers</h2>
            <div id="question-list" class="mb-3"></div>
            <button id="confirm-quiz" class="btn btn-success mt-3">Confirm and Create Quiz</button>
        </div>

        <!-- Quizzes Display Section -->
        <div class="created-quizzes mt-5">
            <h3>Created Quizzes</h3>
            <div id="quiz-list" class="quiz-list">
                <!-- Quizzes will be displayed here dynamically -->
            </div>
        </div>
    </div>
</body>

</html>
