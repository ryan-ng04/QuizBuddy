<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homepage</title>
    <link rel="stylesheet" href="homepage.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>
    <nav class="navbar bg-dark navbar-dark">
        <div class="container-fluid">
            <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebar"
                aria-controls="sidebar">
                <span class="navbar-toggler-icon"></span>
            </button>
        </div>
    </nav>

    <!-- Sidebar -->
<div class="offcanvas offcanvas-start bg-dark" id="sidebar">
    <div class="offcanvas-header">
        <h5 class="offcanvas-title text-white">Menu</h5>
        <button type="button" class="btn-close text-white" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body">
        <ul class="list-group" id="quiz-list">
                <li class="list-group-item bg-dark border-0">
                    <a href="#" class="text-white" id="homeLink">Home</a>
                </li>
                <li class="list-group-item bg-dark border-0">
                    <a href="#" class="text-white" id="topicsLink">Topics</a>
                </li>
                <li class="list-group-item bg-dark border-0">
                    <a href="index.html" class="text-white">Quizzes</a>
                </li>
                <li class="list-group-item bg-dark border-0">
                    <a href="create-quiz.html" class="text-white">Create Quiz</a>
                </li>
            </ul>
        </div>
    </div>
    <!-- My Quizzes Dropdown -->
    <div class="dropdown mt-3">
        <button class="btn btn-secondary dropdown-toggle" type="button" id="myQuizzesDropdown" data-bs-toggle="dropdown"
            aria-expanded="false">
            My Quizzes
        </button>
        <ul class="dropdown-menu" aria-labelledby="myQuizzesDropdown" id="my-quizzes-list">
            <!-- Quizzes will be populated here dynamically -->
        </ul>
    </div>
    <!-- Main Content -->
    <div class="container mt-5">
        <div class="row">
            <div class="col-12 text-center">
                <h1 class="display-4">QuizBuddy</h1>
                <p class="lead">Study with a buddy to learn</p>
                <a href="index.html" class="btn btn-primary btn-lg mt-4">Go to Quizzes</a>
            </div>
        </div>
    </div>

    <script src="hp.js"></script>
</body>

</html>
